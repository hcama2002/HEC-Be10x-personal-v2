<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <radialGradient id="skinGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fdf2e9" />
      <stop offset="70%" stop-color="#fbd9c4" />
      <stop offset="100%" stop-color="#f2be9b" />
    </radialGradient>

    <!-- Hair Tone Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1d17" />
      <stop offset="50%" stop-color="#3d271e" />
      <stop offset="100%" stop-color="#1f1410" />
    </linearGradient>

    <!-- Silk Blouse Gradient -->
    <linearGradient id="silkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Tweed Jacket Pattern -->
    <pattern id="tweedPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f8fafc" />
      <rect x="0" y="0" width="8" height="8" fill="#1e293b" opacity="0.85" />
      <rect x="8" y="8" width="8" height="8" fill="#1e293b" opacity="0.85" />
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
      <path d="M 4 0 L 4 16 M 12 0 L 12 16" stroke="#d97706" stroke-width="0.75" opacity="0.35" />
      <path d="M 0 4 L 16 4 M 0 12 L 16 12" stroke="#d97706" stroke-width="0.75" opacity="0.35" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Studio Halo -->
  <circle cx="200" cy="180" r="160" fill="#ffffff" opacity="0.6" />

  <!-- Tweed Jacket (Shoulders & Chest) -->
  <path d="M 40 400 C 40 320, 80 270, 140 255 L 170 310 L 200 330 L 230 310 L 260 255 C 320 270, 360 320, 360 400 Z" fill="url(#tweedPattern)" stroke="#334155" stroke-width="2" />

  <!-- Jacket Lapels -->
  <path d="M 120 260 L 175 350 L 155 400 L 95 400 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 280 260 L 225 350 L 245 400 L 305 400 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />

  <!-- Silk Cowl Neck Blouse -->
  <path d="M 155 255 Q 200 295 245 255 L 235 340 Q 200 355 165 340 Z" fill="url(#silkGrad)" opacity="0.95" />
  <path d="M 165 270 Q 200 310 235 270" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 175 290 Q 200 320 225 290" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" />

  <!-- Neck -->
  <path d="M 172 195 L 172 265 Q 200 278 228 265 L 228 195 Z" fill="#f8cbb0" />
  <path d="M 172 220 Q 200 240 228 220" stroke="#e0a382" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Pearl Necklace -->
  <g>
    <!-- Pearl chain curve -->
    <path d="M 168 240 Q 200 268 232 240" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5" />
    <!-- Individual luminous pearls -->
    <circle cx="170" cy="241" r="3.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="177" cy="246" r="3.4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="185" cy="250" r="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="193" cy="253" r="3.6" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="200" cy="254" r="3.7" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="207" cy="253" r="3.6" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="215" cy="250" r="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="223" cy="246" r="3.4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <circle cx="230" cy="241" r="3.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
  </g>

  <!-- Head Base (Face) -->
  <ellipse cx="200" cy="175" rx="64" ry="74" fill="url(#skinGrad)" />
  <!-- Chin and Jaw contour -->
  <path d="M 144 165 C 144 230, 168 245, 200 245 C 232 245, 256 230, 256 165 Z" fill="url(#skinGrad)" />

  <!-- Cheeks / Warmth -->
  <circle cx="162" cy="188" r="16" fill="#f472b6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="238" cy="188" r="16" fill="#f472b6" opacity="0.15" filter="url(#softGlow)" />

  <!-- Eyes & Eyebrows -->
  <!-- Left Eyebrow -->
  <path d="M 158 142 Q 174 135 186 142" stroke="#3d271e" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <!-- Right Eyebrow -->
  <path d="M 214 142 Q 226 135 242 142" stroke="#3d271e" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Left Eye -->
  <ellipse cx="172" cy="154" rx="8" ry="5.5" fill="#ffffff" />
  <circle cx="173" cy="154" r="4.2" fill="#3b2216" />
  <circle cx="174" cy="153" r="1.5" fill="#ffffff" />
  <path d="M 163 151 Q 172 147 181 151" stroke="#2d1d17" stroke-width="2" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="228" cy="154" rx="8" ry="5.5" fill="#ffffff" />
  <circle cx="227" cy="154" r="4.2" fill="#3b2216" />
  <circle cx="226" cy="153" r="1.5" fill="#ffffff" />
  <path d="M 219 151 Q 228 147 237 151" stroke="#2d1d17" stroke-width="2" fill="none" />

  <!-- Nose -->
  <path d="M 198 152 L 196 182 Q 199 188 204 184" stroke="#d48a60" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <ellipse cx="193" cy="183" rx="2" ry="1.2" fill="#c07850" opacity="0.7" />
  <ellipse cx="207" cy="183" rx="2" ry="1.2" fill="#c07850" opacity="0.7" />

  <!-- Warm, Radiant Smile -->
  <path d="M 172 202 Q 200 228 228 202" stroke="#b91c1c" stroke-width="2.5" fill="#991b1b" stroke-linecap="round" />
  <!-- Teeth -->
  <path d="M 176 203 Q 200 216 224 203 Q 200 206 176 203 Z" fill="#ffffff" />
  <!-- Smile contour lines -->
  <path d="M 164 195 Q 168 204 174 212" stroke="#d48a60" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 236 195 Q 232 204 226 212" stroke="#d48a60" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Elegant Burgundy Glasses Frames -->
  <g>
    <!-- Left Lens Rim -->
    <rect x="154" y="140" width="37" height="28" rx="8" ry="8" fill="none" stroke="#701a35" stroke-width="3" />
    <rect x="156" y="142" width="33" height="24" rx="6" ry="6" fill="#e0f2fe" opacity="0.25" />
    <!-- Right Lens Rim -->
    <rect x="209" y="140" width="37" height="28" rx="8" ry="8" fill="none" stroke="#701a35" stroke-width="3" />
    <rect x="211" y="142" width="33" height="24" rx="6" ry="6" fill="#e0f2fe" opacity="0.25" />
    <!-- Bridge -->
    <path d="M 191 148 Q 200 144 209 148" stroke="#701a35" stroke-width="2.8" fill="none" />
    <!-- Left Temple -->
    <path d="M 154 148 L 138 145" stroke="#701a35" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Right Temple -->
    <path d="M 246 148 L 262 145" stroke="#701a35" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wavy Voluminous Short Dark Hair -->
  <!-- Top and sides hair layers -->
  <path d="M 136 155 C 120 120, 135 70, 195 65 C 265 60, 280 115, 264 155 C 275 140, 276 105, 260 85 C 240 60, 160 60, 140 85 C 124 105, 125 140, 136 155 Z" fill="url(#hairGrad)" />
  
  <!-- Left Hair Volume & Waves -->
  <path d="M 134 145 C 122 135, 120 170, 138 185 C 142 165, 140 150, 134 145 Z" fill="url(#hairGrad)" />
  <path d="M 130 115 Q 115 135 128 160 Q 138 135 130 115 Z" fill="#2d1d17" />
  <path d="M 140 95 Q 125 115 135 140" stroke="#4a3328" stroke-width="2" fill="none" />

  <!-- Right Hair Volume & Waves -->
  <path d="M 266 145 C 278 135, 280 170, 262 185 C 258 165, 260 150, 266 145 Z" fill="url(#hairGrad)" />
  <path d="M 270 115 Q 285 135 272 160 Q 262 135 270 115 Z" fill="#2d1d17" />
  <path d="M 260 95 Q 275 115 265 140" stroke="#4a3328" stroke-width="2" fill="none" />

  <!-- Hair Forehead Fringe / Curls -->
  <path d="M 145 115 Q 170 95 195 112 Q 225 95 255 115 Q 235 105 200 108 Q 165 105 145 115 Z" fill="#3d271e" />
  <path d="M 160 100 Q 180 88 200 95 Q 220 88 240 100" stroke="#4a3328" stroke-width="2.5" fill="none" />

  <!-- Delicate Gold Earrings -->
  <circle cx="137" cy="186" r="3.5" fill="none" stroke="#d97706" stroke-width="1.5" />
  <circle cx="263" cy="186" r="3.5" fill="none" stroke="#d97706" stroke-width="1.5" />

</svg>
